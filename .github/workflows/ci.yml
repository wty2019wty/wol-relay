---
name: CI
permissions:
  contents: read

on:
  push:
    branches: [main,dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：amd64/arm64 原生运行
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Windows：amd64 原生运行
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows ARM64 没有托管运行器，仅验证交叉编译
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            compile-only: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Run tests
        if: ${{ !matrix.compile-only }}
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Verify cross-compilation
        if: matrix.compile-only
        run: cargo build --locked --release --target ${{ matrix.target }}

  docker:
    name: Docker build (linux/amd64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: wol-relay:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

      - name: Smoke test image
        run: docker run --rm wol-relay:ci --version
