---
name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：amd64/arm64 原生构建
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Windows：amd64 原生构建，ARM64 用 MSVC 工具链交叉构建
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 防止 tag 与 Cargo 包版本不一致（例如 tag 为 v0.2.11，Cargo.toml 仍是 0.2.0）。
      - name: Verify package version matches tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(cargo pkgid -p wol-relay)"
          actual="${actual##*#}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::package version '$actual' does not match tag '$expected'"
            exit 1
          fi

      # 交叉编译的目标无法在构建机上执行，只在原生目标上检查二进制输出。
      - name: Verify binary version matches tag
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          bin="wol-relay"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            bin="wol-relay.exe"
          fi
          actual="$(target/${{ matrix.target }}/release/${bin} --version | awk '{print $2}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::binary version '$actual' does not match tag '$expected'"
            exit 1
          fi

      # 打包二进制、README 和 LICENSE：Windows 用 .zip，其余用 .tar.gz
      - name: Package binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          stage="wol-relay-${version}-${target}"
          bin="wol-relay"
          if [[ "$target" == *-windows-* ]]; then
            bin="wol-relay.exe"
          fi
          mkdir -p "dist/${stage}"
          cp "target/${target}/release/${bin}" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          if [[ "$target" == *-windows-* ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${stage}' -DestinationPath 'dist/${stage}.zip' -Force"
          else
            (cd dist && tar -czf "${stage}.tar.gz" "${stage}")
          fi
          rm -rf "dist/${stage}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wol-relay-${{ matrix.target }}
          path: dist/wol-relay-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum wol-relay-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/wol-relay-*
            dist/SHA256SUMS
          generate_release_notes: true
