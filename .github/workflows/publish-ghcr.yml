---
name: Publish GHCR image
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main,dev]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Compute temporary per-arch tag
        id: tag
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}:build-${GITHUB_SHA}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tag.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 防止发布空壳二进制（例如依赖缓存陈旧导致的构建）。该步骤在 merge 任务之前
      # 运行，失败时镜像不会被打上正式 tag。
      - name: Smoke test the built image
        env:
          IMAGE_REF: ${{ steps.tag.outputs.ref }}
        run: |
          out="$(docker run --rm "$IMAGE_REF" --version)"
          echo "$out"
          case "$out" in
            wol-relay*) ;;
            *) echo "::error::unexpected --version output: '$out'"; exit 1 ;;
          esac

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=develop

      - name: Create and push manifest list
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          src="${REGISTRY}/${IMAGE_NAME,,}:build-${GITHUB_SHA}"
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              "${src}-amd64" "${src}-arm64"
            docker buildx imagetools inspect "$tag"
          done
